    <script>
      // Apply stored theme before paint to avoid flash
      (function () {
        try {
          var t = localStorage.getItem('ledger-theme') || 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(t);
        } catch (e) {}
      })();
    </script>
